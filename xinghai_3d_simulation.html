<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>辛亥路方案 3D 模擬</title>
<style>
  /* ===== 深色半透明主題（自訂 CSS，不使用外部框架） ===== */
  :root {
    --glass: rgba(15, 23, 42, .80); --glass2: rgba(30, 41, 59, .72); --border: rgba(148, 163, 184, .22);
    --ink: #e5e7eb; --muted: #94a3b8; --accent: #60a5fa; --accent2: #3b82f6;
    --good: #34d399; --warn: #fbbf24; --bad: #f87171; --track: rgba(148, 163, 184, .18);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3f2; color: var(--ink);
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
  canvas { display: block; }
  .glass { position: absolute; background: var(--glass); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(2, 6, 23, .35); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-sizing: border-box; font-size: 13px; line-height: 1.5; }
  .scroll { overflow: auto; scrollbar-width: thin; scrollbar-color: rgba(148,163,184,.4) transparent; }
  #panel { top: 12px; left: 12px; width: min(330px, calc(100vw - 24px)); max-height: calc(100vh - 24px); padding: 12px 14px; }
  .head { display: flex; align-items: center; gap: 6px; }
  h1 { font-size: 15px; margin: 0; flex: 1; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 11.5px; margin: 6px 0 4px; }
  .step { font-weight: bold; margin-top: 10px; font-size: 12px; color: var(--muted); letter-spacing: .5px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  button { flex: 1 1 64px; border: 1px solid var(--border); background: rgba(255,255,255,.06); color: var(--ink);
    border-radius: 9px; padding: 7px 6px; font-size: 12.5px; font-family: inherit; cursor: pointer; line-height: 1.35;
    transition: background .15s, border-color .15s; }
  button:hover { background: rgba(255,255,255,.12); }
  button.on { background: var(--accent2); border-color: var(--accent); color: #fff; }
  button.mini { flex: none; padding: 3px 9px; font-size: 12px; }
  #info { background: var(--glass2); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; }
  #info b { color: var(--accent); }
  .legend, .models { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 3px 0 6px; vertical-align: -1px; }

  /* ===== 右側 CBA 儀表板 ===== */
  #dash { top: 12px; right: 12px; bottom: 12px; width: min(390px, calc(100vw - 24px)); display: flex; flex-direction: column;
    transition: transform .35s ease, opacity .35s ease; }
  #dash.collapsed { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
  #dashHead { padding: 12px 14px 0; }
  #dashHead h2 { font-size: 15px; margin: 0; flex: 1; }
  .tabs { display: flex; gap: 4px; margin-top: 10px; border-bottom: 1px solid var(--border); }
  .tabs button { flex: 1; border: none; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); padding: 8px 4px; }
  .tabs button.on { background: var(--glass2); color: #fff; box-shadow: inset 0 -2px 0 var(--accent); }
  #dashBody { flex: 1; padding: 10px 14px 14px; }
  #pill { position: absolute; right: 0; top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; flex: none;
    border-radius: 10px 0 0 10px; padding: 14px 8px; background: var(--glass); color: #fff; font-weight: bold;
    border: 1px solid var(--border); border-right: none; display: none; backdrop-filter: blur(12px); letter-spacing: 2px; }
  #pill.show { display: block; }
  .hero { display: flex; gap: 10px; align-items: flex-start; }
  .hero .ttl { flex: 1; }
  .hero .opt { font-size: 18px; font-weight: bold; }
  .hero .tagline { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .badge { display: inline-block; font-size: 11px; font-weight: bold; border-radius: 999px; padding: 2px 9px; margin-top: 6px; }
  .badge.good { background: rgba(52,211,153,.18); color: var(--good); border: 1px solid rgba(52,211,153,.45); }
  .badge.warn { background: rgba(251,191,36,.16); color: var(--warn); border: 1px solid rgba(251,191,36,.45); }
  .badge.bad { background: rgba(248,113,113,.16); color: var(--bad); border: 1px solid rgba(248,113,113,.45); }
  .badge.neutral { background: rgba(148,163,184,.16); color: var(--muted); border: 1px solid var(--border); }
  .note { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .sec { margin-top: 12px; background: var(--glass2); border-radius: 12px; padding: 10px 12px; }
  .sec h3 { font-size: 12.5px; margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
  .sec h3 .ico { width: 18px; height: 18px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
  .metric { display: grid; grid-template-columns: 1fr 92px 46px; gap: 4px 8px; align-items: center; padding: 4px 0; }
  .metric + .metric { border-top: 1px dashed rgba(148,163,184,.15); }
  .metric .lbl { font-size: 12px; }
  .metric .rank { grid-column: 1 / 4; font-size: 10.5px; color: var(--muted); margin-top: -2px; }
  .meter { height: 7px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 4px; transition: width .45s ease; }
  .meter.cost i { background: linear-gradient(90deg, #fbbf24, #f87171); }
  .meter.ben i { background: linear-gradient(90deg, #22d3ee, #34d399); }
  .tag { font-size: 10.5px; text-align: center; border-radius: 6px; padding: 1px 0; font-weight: bold; }
  .tag.hi-cost, .tag.neg, .tag.lo-ben { color: var(--bad); background: rgba(248,113,113,.14); }
  .tag.mid { color: var(--warn); background: rgba(251,191,36,.14); }
  .tag.lo-cost, .tag.hi-ben { color: var(--good); background: rgba(52,211,153,.14); }
  .tag.base { color: var(--muted); background: rgba(148,163,184,.14); }
  .verdict { font-size: 12.5px; }
  .chain { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
  .chain div { font-size: 11.5px; padding: 5px 8px; border-radius: 8px; background: rgba(255,255,255,.04); border-left: 3px solid var(--border); }
  .chain div.hl { border-left-color: var(--accent); background: rgba(96,165,250,.12); color: #fff; }
  .eff { display: flex; gap: 10px; align-items: center; }
  .eff svg { flex: none; }
  .simline { font-size: 11.5px; color: var(--ink); background: rgba(96,165,250,.10); border-radius: 8px; padding: 6px 8px; margin-top: 8px; }

  /* 即時指標分頁 */
  table { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 8px; }
  th, td { padding: 5px 4px; text-align: right; border-bottom: 1px solid rgba(148,163,184,.15); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: normal; font-size: 10.5px; }
  tr.cur td { background: rgba(96,165,250,.14); font-weight: bold; color: #fff; }
  #sig { display: flex; align-items: center; gap: 8px; background: var(--glass2); border-radius: 10px; padding: 8px 10px; font-size: 12px; }
  .lamp { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor; }

  /* 載入畫面 */
  #overlay { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; background: rgba(15,23,42,.72); backdrop-filter: blur(4px); transition: opacity .5s; text-align: center; padding: 16px; }
  #overlay.hide { opacity: 0; pointer-events: none; }
  .spinner { width: 54px; height: 54px; border: 5px solid rgba(96,165,250,.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadText { font-size: 17px; font-weight: bold; }
  #loadSub { font-size: 12px; color: var(--muted); max-width: 520px; }
  .bar { width: min(320px, 70vw); height: 6px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #skipBtn { display: none; flex: none; padding: 8px 16px; }
  #err { display: none; position: absolute; inset: 0; z-index: 30; background: #0f172a; padding: 40px; font-size: 16px; line-height: 1.9; }

  @media (max-width: 760px) {
    #panel { max-height: 46vh; }
    #dash { top: auto; height: 48vh; }
  }
</style>
</head>
<body>

<!-- ===== 左側：控制面板 ===== -->
<div id="panel" class="glass scroll">
  <div class="head">
    <h1 data-i18n="title"></h1>
    <button id="langBtn" class="mini">EN</button>
    <button id="fold" class="mini">－</button>
  </div>
  <div id="panelBody">
    <div class="sub" data-i18n="sub"></div>
    <div class="step" data-i18n="step1"></div>
    <div class="row">
      <button data-opt="0" data-i18n="opt0"></button>
      <button data-opt="A" data-i18n="optA"></button>
      <button data-opt="B" data-i18n="optB"></button>
      <button data-opt="C" data-i18n="optC"></button>
    </div>
    <div id="info"></div>
    <div class="step" data-i18n="step2"></div>
    <div class="row">
      <button data-view="section" data-i18n="vSection"></button>
      <button data-view="eye" data-i18n="vEye"></button>
      <button data-view="bird" data-i18n="vBird"></button>
    </div>
    <div class="step" data-i18n="step3"></div>
    <div class="row">
      <button data-speed="1">1×</button><button data-speed="2">2×</button><button data-speed="4">4×</button>
      <button id="pauseBtn"></button>
    </div>
    <div class="row"><button id="perfBtn"></button></div>
    <div class="legend" data-i18n="legend"></div>
    <div class="models" id="modelStatus"></div>
  </div>
</div>

<!-- ===== 右側：CBA 儀表板 ===== -->
<div id="dash" class="glass">
  <div id="dashHead">
    <div class="head"><h2 data-i18n="dashTitle"></h2><button id="dashHide" class="mini" title="收合">⟩</button></div>
    <div class="tabs">
      <button data-tab="cba" class="on" data-i18n="tabCBA"></button>
      <button data-tab="live" data-i18n="tabLive"></button>
    </div>
  </div>
  <div id="dashBody" class="scroll">
    <div id="tab-cba"></div>
    <div id="tab-live" style="display:none">
      <div id="sig"></div>
      <table id="kpiTable"></table>
      <div class="note" data-i18n="kpiNote"></div>
      <div class="row"><button id="resetBtn" data-i18n="reset"></button></div>
    </div>
  </div>
</div>
<button id="pill" data-i18n="pill"></button>

<div id="overlay">
  <div class="spinner"></div>
  <div id="loadText" data-i18n="loading"></div>
  <div class="bar"><div id="loadBar"></div></div>
  <div id="loadSub" data-i18n="loadSub"></div>
  <button id="skipBtn" data-i18n="skip"></button>
</div>
<div id="err" data-i18n="err"></div>

const LANES = [
  { z: 1.9, dir: 1, v0: 16.7, n: 8, through: true }, { z: 5.4, dir: 1, v0: 13.9, n: 8, through: true },
  { z: -1.9, dir: -1, v0: 16.7, n: 8, through: true }, { z: -5.4, dir: -1, v0: 13.9, n: 8, through: true },
  { z: 17, dir: 1, v0: 11.1, n: 6, through: false }, { z: -17, dir: -1, v0: 11.1, n: 6, through: false }

function idm(v, v0, gap, dv) {
  const a = 1.8, b = 2.5, s0 = 2.0, T = 1.1;
  const ss = s0 + Math.max(0, v * T + v * dv / (2 * Math.sqrt(a * b)));
  return a * (1 - Math.pow(v / v0, 4) - Math.pow(ss / Math.max(gap, 0.05), 2));
}
function crosswalksFor(o) {

  if (o === 'A') return STREAMS.map(x => ({ x, half: 3.5, local: true }));

}

function cwBlocked(cw, lane, car, d) {
  if (cw.signal) {
    const n = sigName();
    if (n === 'VY') { if (d > car.v * car.v / 6) return true; }
    else if (n !== 'VG') return true;
  }
  for (const p of peds) {
    if (p.active && p.onRoad && !p.waiting && Math.abs(p.pos.x - cw.x) < cw.half + 1.2 && Math.abs(p.pos.z - lane.z) < 4.5) return true;
  }

}
function vehStep(dt) {
  LANES.forEach(lane => {
    const arr = lane.cars.slice().sort((a, b) => a.s - b.s), n = arr.length;
    arr.forEach((car, i) => {
      const lead = arr[(i + 1) % n];
      let gap = (lead.s - lead.len / 2) - (car.s + car.len / 2);
      if (i === n - 1) gap += L;
      let acc = idm(car.v, car.v0, gap, car.v - lead.v);
      for (const cw of CW) {

        let d = lane.dir * cw.x - (cw.half + 1.7) - (car.s + car.len / 2);
        if (d < -0.5) d += L;
        if (d > 120) continue;
        if (cwBlocked(cw, lane, car, d)) acc = Math.min(acc, idm(car.v, car.v0, Math.max(d, 0.05), car.v));
      }
      car.v = Math.max(0, car.v + Math.max(acc, -9) * dt);
      car.s += car.v * dt;

}

  arm: (() => { const g = new THREE.BoxGeometry(0.1, 0.62, 0.11); g.translate(0, -0.31, 0); return g; })(),
  torso: new THREE.BoxGeometry(0.42, 0.62, 0.24), head: new THREE.SphereGeometry(0.12, 12, 10),
  bag: new THREE.BoxGeometry(0.32, 0.4, 0.15)
};
const SKIN = lam(0xe0b394), PANTS = lam(0x2d3748), BAG = lam(0x3b4252);
function makePedProc(i) {
  const g = new THREE.Group(), shirt = lam(CLOTHES[i % CLOTHES.length]);
  const legs = [-0.11, 0.11].map(x => { const p = new THREE.Group(); p.position.set(x, 0.92, 0); mesh(PG.leg, PANTS, p); g.add(p); return p; });
  mesh(PG.torso, shirt, g, 0, 1.23, 0); mesh(PG.head, SKIN, g, 0, 1.68, 0);
  const arms = [-0.27, 0.27].map(x => { const p = new THREE.Group(); p.position.set(x, 1.5, 0); mesh(PG.arm, shirt, p); g.add(p); return p; });
  if (i % 2 === 0) mesh(PG.bag, BAG, g, 0, 1.28, -0.2);     // 學生背包
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  let ph = Math.random() * 6, w = 1;
  return {
    obj: g,
    animate(dt, moving, v) {
      w += ((moving ? 1 : 0) - w) * Math.min(1, dt * 6);
      ph += dt * v * 4.5;
      const a = Math.sin(ph) * 0.55 * w;
      legs[0].rotation.x = a; legs[1].rotation.x = -a; arms[0].rotation.x = -a * 0.8; arms[1].rotation.x = a * 0.8;
    }

}

/* ---------------- 11. 行人路徑（依方案）與模擬 ---------------- */
// 路徑一律以「南（台大）→ 北」建立；北 → 南時把 z 鏡射
function buildRoute(o, x0, sgn, jitter) {
  const off = jitter ? (Math.random() * 2 - 1) * 1.6 : 0, G0 = GROUND;
  let P;
  if (o === '0') {
    const xc = X_GATE + off;
    const wz = 21.2 + (jitter ? Math.random() * 1.2 : 0);
    P = [[x0, G0, 29.5], [xc, G0, 29.5], [xc, G0, wz, { sig: 1, need: wz - 0.4 }],
         [xc, G0, 0.4, { sig: 1, need: 20.8 }], [xc, G0, -21.2], [xc, G0, -29.5], [x0, G0, -29.5]];
  } else if (o === 'A') {
    P = [[x0 + off, G0, 29.5], [x0 + off, G0, -29.5]];
  } else if (o === 'C') {
    const xl = LIDS.reduce((a, b) => Math.abs(b - x0) < Math.abs(a - x0) ? b : a) + off;
    P = [[x0, G0, 29.5], [xl, G0, 29.5], [xl, G0, -29.5], [x0, G0, -29.5]];
  } else {
    const xr = RAMPS.reduce((a, b) => Math.abs(b - x0) < Math.abs(a - x0) ? b : a);
    const xw = xr + (x0 > xr ? 3 : -3), xp = xr + off * 0.6;
    P = [[x0, G0, 29.5], [xw, G0, 29.5], [xw, G0, 61.5], [xp, G0, 61], [xp, 7.55, 12], [xp, 7.55, -12],
         [xp, G0, -61], [xw, G0, -61.5], [xw, G0, -29.5], [x0, G0, -29.5]];
  }
  return P.map(p => Object.assign({ x: p[0], y: p[1], z: p[2] * sgn }, p[3] || {}));
}
function routeLen(r) { let d = 0; for (let i = 1; i < r.length; i++) d += Math.hypot(r[i].x - r[i - 1].x, r[i].y - r[i - 1].y, r[i].z - r[i - 1].z); return d; }
const ROUTE_STATS = {};
OPTS.forEach(o => {
  const rs = STREAMS.map(x => buildRoute(o, x, 1, false));
  ROUTE_STATS[o] = { dist: rs.reduce((s, r) => s + routeLen(r), 0) / rs.length, climb: Math.max(...rs.flat().map(p => p.y)) - GROUND };
});

const N_PEDS = 30, SPAWN_DT = 1.8;
const peds = [];
const stats = {}; const resetStats = () => OPTS.forEach(o => { stats[o] = { n: 0, T: 0, W: 0, vS: 0, vT: 0 }; }); resetStats();
let spawnAcc = 0, spawnIdx = 0;

function startTrip(p, x0, sgn, warm) {
  p.route = buildRoute(opt, x0, sgn, true);
  p.seg = 0; p.departed = false; p.waiting = false;
  p.pos.set(p.route[0].x, p.route[0].y, p.route[0].z);
  p.v = 1.15 + Math.random() * 0.35; p.t0 = simT; p.wait = 0; p.warm = !!warm; p.active = true;
  p.vis.obj.visible = true;
  if (warm) {                               // 切換方案時：把行人隨機放到路徑中途，畫面立即有人
    let left = Math.random() * routeLen(p.route) * 0.85;
    while (p.seg < p.route.length - 1) {
      const a = p.route[p.seg], b = p.route[p.seg + 1];
      const d = Math.hypot(b.x - a.x, b.y - a.y, b.z - a.z);
      if (left < d) { const f = left / d; p.pos.set(a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f, a.z + (b.z - a.z) * f); p.departed = true; break; }
      left -= d; p.seg++; p.pos.set(b.x, b.y, b.z);
    }
  }
}
function finishTrip(p) {
  if (!p.warm) { const s = stats[opt]; s.n++; s.T += simT - p.t0; s.W += p.wait; }
  p.active = false; p.vis.obj.visible = false;
}
function pedStep(p, dt) {
  const r = p.route;
  if (p.seg >= r.length - 1) { finishTrip(p); return; }
  const a = r[p.seg], b = r[p.seg + 1];
  if (!p.departed) {
    if (a.sig && opt === '0' && pedWalkLeft() < a.need / p.v) {
      p.waiting = true; p.wait += dt;
      p.heading = Math.atan2(b.x - a.x, b.z - a.z);
      return;
    }
    p.departed = true; p.waiting = false;
  }
  const dx = b.x - p.pos.x, dy = b.y - p.pos.y, dz = b.z - p.pos.z, dh = Math.hypot(dx, dz);
  const slope = dh > 0.01 ? dy / dh : 0;
  const v = p.v * (slope > 0.05 ? 0.78 : slope < -0.05 ? 0.92 : 1);   // 上坡變慢
  p.vNow = v;
  const step = v * dt;
  if (step >= dh) { p.pos.set(b.x, b.y, b.z); p.seg++; p.departed = false; }
  else { const f = step / dh; p.pos.x += dx * f; p.pos.y += dy * f; p.pos.z += dz * f; p.heading = Math.atan2(dx, dz); }
  const az = Math.abs(p.pos.z);
  p.onRoad = p.pos.y < 1 && ((az > 13.2 && az < 20.8) || (opt === '0' && az < 11.2));
}
function spawnStep(dt) {
  spawnAcc += dt;
  if (spawnAcc < SPAWN_DT) return;
  spawnAcc -= SPAWN_DT;
  const p = peds.find(q => !q.active); if (!p) return;
  const si = spawnIdx % STREAMS.length, sgn = (Math.floor(spawnIdx / STREAMS.length) % 2) ? -1 : 1;
  spawnIdx++;
  startTrip(p, STREAMS[si], sgn, false);
}
function warmStart() {
  peds.forEach(p => { p.active = false; p.vis.obj.visible = false; });
  peds.slice(0, 14).forEach((p, i) => startTrip(p, STREAMS[i % 3], i % 2 ? -1 : 1, true));
  spawnAcc = 0;
}

/* ---------------- 12. CBA 儀表板資料（摘自階段二比較框架；0–5 定性評等） ---------------- */
// 成本列：數值越高＝成本越高；效益列：數值越高＝效益越大；-1＝負效益
const CBA = {
  cost: [
    { k: 'cCons',  v: { A: 5, B: 3, C: 3 },   rank: 'A > C ≈ B' },
    { k: 'cOM',    v: { A: 5, B: 4, C: 2 },   rank: 'A > B > C' },
    { k: 'cRisk',  v: { A: 5, B: 3, C: 3 },   rank: 'A > B ≈ C' }
  ],
  int: [
    { k: 'iDelay',  v: { A: 5, B: 3, C: 5 },   rank: 'A ≈ C > B', note: { B: 'noteBdelay' } },
    { k: 'iPed',    v: { A: 5, B: -1, C: 4 },  rank: 'A ≈ C ≫ B' },
    { k: 'iSafety', v: { A: 4, B: 3.5, C: 4.5 }, rank: 'C ≥ A > B' }
  ],
  ext: [
    { k: 'eSev',    v: { A: 5, B: 2, C: 4 },     rank: 'A > C > B' },
    { k: 'eNoise',  v: { A: 4.5, B: 5, C: 2.5 }, rank: 'B ≥ A > C' },
    { k: 'eAir',    v: { A: 4, B: 4, C: 2.5 },   rank: 'B ≈ A > C' },
    { k: 'eCarbon', v: { A: 2, B: 2.5, C: 4 },   rank: 'C > B ≳ A' },
    { k: 'eLand',   v: { A: 5, B: 3.5, C: 3 },   rank: 'A > B ≈ C' }
  ]
};
const BADGE_CLS = { '0': 'neutral', A: 'warn', B: 'bad', C: 'good' };
function indexOf(o) {                       // 定性指數（只用於象限圖的相對位置）
  if (o === '0') return { b: 0, c: 0 };
  const avg = rows => rows.reduce((s, r) => s + Math.max(0, r.v[o]), 0) / rows.length;
  return { b: avg([...CBA.int, ...CBA.ext]), c: avg(CBA.cost) };
}
function meter(v, kind) {
  if (opt === '0') return `<div class="meter ${kind}"><i style="width:0"></i></div><span class="tag base">${t('tagBase')}</span>`;
  if (v < 0) return `<div class="meter ${kind}"><i style="width:4%;background:#f87171"></i></div><span class="tag neg">${t('tagNeg')}</span>`;
  const lvl = v >= 4 ? 'H' : v >= 2.5 ? 'M' : 'L';
  const cls = lvl === 'M' ? 'mid' : kind === 'cost' ? (lvl === 'H' ? 'hi-cost' : 'lo-cost') : (lvl === 'H' ? 'hi-ben' : 'lo-ben');
  return `<div class="meter ${kind}"><i style="width:${v / 5 * 100}%"></i></div><span class="tag ${cls}">${t('tag' + lvl)}</span>`;
}
function section(icon, color, titleKey, rows, kind) {
  const body = rows.map(r => {
    const note = (r.note && r.note[opt]) ? `<div class="rank" style="color:#fbbf24">${t(r.note[opt])}</div>` : '';
    return `<div class="metric"><span class="lbl">${t(r.k)}</span>${meter(opt === '0' ? 0 : r.v[opt], kind)}` +
      `<div class="rank">${t('rankLbl')}：${r.rank}${kind === 'cost' ? ' ' + t('rankCost') : ''}</div>${note}</div>`;
  }).join('');
  return `<div class="sec"><h3><span class="ico" style="background:${color}">${icon}</span>${t(titleKey)}</h3>${body}</div>`;
}
function effSVG() {                         // 定性效率象限圖（成本指數 × 效益指數）
  const W = 150, H = 120, P = 18, X = v => P + v / 5 * (W - P - 6), Y = v => H - P - v / 5 * (H - P - 6);
  const col = { '0': '#94a3b8', A: '#fbbf24', B: '#f87171', C: '#34d399' };
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">`;
  s += `<rect x="${P}" y="6" width="${W - P - 6}" height="${H - P - 6}" rx="6" fill="rgba(148,163,184,.08)" stroke="rgba(148,163,184,.25)"/>`;
  s += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(5)}" y2="${Y(5)}" stroke="rgba(148,163,184,.35)" stroke-dasharray="3 3"/>`;
  OPTS.forEach(o => {
    const p = indexOf(o), cur = o === opt;
    s += `<circle cx="${X(p.c)}" cy="${Y(p.b)}" r="${cur ? 7 : 5}" fill="${col[o]}" ${cur ? 'stroke="#fff" stroke-width="2"' : 'opacity=".75"'}/>`;
    s += `<text x="${X(p.c) + 9}" y="${Y(p.b) + 4}" font-size="11" fill="#e5e7eb" font-weight="${cur ? 700 : 400}">${o}</text>`;
  });
  s += `<text x="${W - 6}" y="${H - 4}" font-size="9" fill="#94a3b8" text-anchor="end">${t('effX')}</text>`;
  s += `<text x="10" y="${H - P}" font-size="9" fill="#94a3b8" transform="rotate(-90 10 ${H - P})">${t('effY')}</text>`;
  return s + '</svg>';
}
function renderCBA() {
  const s = stats[opt], rs = ROUTE_STATS[opt];
  const sim = t('simLine').replace('{d}', rs.dist.toFixed(0)).replace('{c}', rs.climb.toFixed(1))
    .replace('{t}', s.n ? (s.T / s.n).toFixed(1) + ' s' : t('simNA'));
  const chain = [['0B', opt === 'B'], ['BC', opt === 'C' || opt === 'B'], ['CA', opt === 'A' || opt === 'C']]
    .map(([k, hl]) => `<div class="${hl ? 'hl' : ''}">${t('chain' + k)}</div>`).join('');
  $('tab-cba').innerHTML =
    `<div class="hero"><div class="ttl"><div class="opt">${t('row' + opt)}</div><div class="tagline">${t('tag' + opt)}</div>` +

    `<div class="note">${t('cbaSub')}</div>` +
    section('$', 'rgba(251,191,36,.25)', 'secCost', CBA.cost, 'cost') +
    section('⏱', 'rgba(34,211,238,.22)', 'secInt', CBA.int, 'ben') +
    `<div class="simline">${sim}</div>` +

    `<div class="eff" style="margin-top:10px">${effSVG()}<div><b style="font-size:12px">${t('effTitle')}</b><div class="note">${t('effNote')}</div></div></div>` +
    `<div class="note" style="margin-top:10px"><b>${t('chainTitle')}</b></div><div class="chain">${chain}</div></div>`;

/* ---------------- 14. 陰影設定 ---------------- */
function shadowify(root) {
  root.traverse(o => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const flat = mats.some(m => m.isMeshBasicMaterial || m.transparent);
    o.castShadow = !flat && !o.userData.noCast;
    o.receiveShadow = !flat;
  });
}

/* ---------------- 15. 主迴圈 ---------------- */
let ready = false, uiAcc = 0, cbaAcc = 0, last = performance.now(), optT = 0;
const THRU = () => cars.filter(c => c.lane.through);
function simStep(h) {
  simT += h; optT += h; sigStep(h); vehStep(h);
  peds.forEach(p => { if (p.active) pedStep(p, h); });
  spawnStep(h);
  if (optT > 20) {                          // 排除切換方案後的暫態（例如號誌停等車隊消散）
    const th = THRU(), st = stats[opt];
    st.vS += th.reduce((s, c) => s + c.v, 0) / th.length * h; st.vT += h;
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  const simDt = (ready && !paused) ? dt * speed : 0;
  let rem = simDt;
  while (rem > 1e-6) {                      // 固定小步長模擬，倍速也穩定
    const h = Math.min(rem, 0.05); rem -= h;
    simStep(h);
  }
  if (ready) {
    cars.forEach(c => {
      c.obj.position.set(c.lane.dir * c.s, c.lane.through ? LEVEL[opt] + 0.04 : 0.04, c.lane.z);
      c.wheels.forEach(w => { w.rotation.z -= c.v * simDt / c.r; });
      if (c.mixer) c.mixer.update(simDt * c.v / 6);
    });
    peds.forEach(p => {
      if (!p.active) return;
      p.vis.obj.position.copy(p.pos);
      p.vis.obj.rotation.y = p.heading || 0;
      p.vis.animate(simDt, !p.waiting && simDt > 0, p.vNow || p.v);
    });
  }
  updateLamps();
  if (camGoal) {
    const f = 1 - Math.pow(0.02, dt);
    camera.position.lerp(camGoal.p, f); controls.target.lerp(camGoal.t, f);
    if (camera.position.distanceTo(camGoal.p) < 0.05) camGoal = null;
  }
  controls.update();
  renderer.render(scene, camera);
  uiAcc += dt; cbaAcc += dt;
  if (uiAcc > 0.4) { uiAcc = 0; if (tab === 'live') renderKPI(); }
  if (cbaAcc > 3) { cbaAcc = 0; if (tab === 'cba') renderCBA(); }   // 更新「模擬佐證」一行
}
shadowify(scene);
setOption('0');
updateViewOffset();
requestAnimationFrame(frame);

/* ---------------- 16. 非同步載入外部模型（含進度條、逾時與備援） ---------------- */
const gltfLoader = new GLTFLoader();
function loadGLB(urls, onProg) {
  return new Promise(resolve => {
    let i = 0;
    const next = () => {
      if (i >= urls.length) { resolve(null); return; }
      const url = urls[i++]; let done = false;
      const to = setTimeout(() => { if (!done) { done = true; next(); } }, CFG.MODEL_TIMEOUT);
      gltfLoader.load(url,
        g => { if (done) return; done = true; clearTimeout(to); onProg(1); resolve(g); },
        e => { if (e.total) onProg(e.loaded / e.total); },
        () => { if (done) return; done = true; clearTimeout(to); next(); });
    };
    next();
  });
}
const prog = { ped: 0, truck: 0 };
const bar = () => { $('loadBar').style.width = Math.round((prog.ped * 0.88 + prog.truck * 0.12) * 100) + '%'; };
let skip; const skipP = new Promise(r => { skip = r; });
setTimeout(() => { $('skipBtn').style.display = 'inline-block'; }, 6000);
$('skipBtn').onclick = () => skip('skip');
const res = await Promise.race([
  Promise.all([loadGLB(CFG.MODELS.ped, f => { prog.ped = f; bar(); }), loadGLB(CFG.MODELS.truck, f => { prog.truck = f; bar(); })]),
  skipP
]);
const [pedG, truckG] = res === 'skip' ? [null, null] : res;
if (pedG && pedG.animations.some(a => a.name === 'walk')) pedTpl = pedG;
if (truckG) truckTpl = prepTruck(truckG);
modelStatus.ped = !!pedTpl; modelStatus.truck = !!truckTpl;

// 建立車隊
let ci = 0;
LANES.forEach(lane => {
  lane.cars = [];
  for (let i = 0; i < lane.n; i++) {
    const big = lane.through ? i % 4 === 3 : i % 3 === 2;
    const vis = big ? makeTruck() : makeCar(ci++);
    const car = Object.assign(vis, { lane, s: -HALF + (i + rnd() * 0.4) * L / lane.n, v0: lane.v0 * (0.92 + rnd() * 0.16) });
    car.v = car.v0 * 0.8;
    car.obj.rotation.y = lane.dir > 0 ? 0 : Math.PI;
    shadowify(car.obj); scene.add(car.obj);
    lane.cars.push(car); cars.push(car);
  }
});
// 建立行人
for (let i = 0; i < N_PEDS; i++) {
  const vis = pedTpl ? makePedGLTF(i) : makePedProc(i);
  vis.obj.visible = false; scene.add(vis.obj);
  peds.push({ vis, pos: new THREE.Vector3(), active: false, heading: 0 });
}
ready = true;
warmStart();
renderStatus(); renderKPI(); renderCBA();
$('overlay').classList.add('hide');
window.__sim = { setOption, setView, setSpeed, setPerf, setDash, stats, ROUTE_STATS, modelStatus, sig: () => sigName(),
  ff: sec => { for (let k = 0; k < sec / 0.05; k++) simStep(0.05); } };   // 測試用：快轉模擬
</script>
</body>
</html>
