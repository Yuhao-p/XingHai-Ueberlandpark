<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>辛亥路方案 3D 模擬</title>
<style>
  /* ===== 深色半透明主題（自訂 CSS，不使用外部框架） ===== */
  :root {
    --glass: rgba(15, 23, 42, .80); --glass2: rgba(30, 41, 59, .72); --border: rgba(148, 163, 184, .22);
    --ink: #e5e7eb; --muted: #94a3b8; --accent: #60a5fa; --accent2: #3b82f6;
    --good: #34d399; --warn: #fbbf24; --bad: #f87171; --track: rgba(148, 163, 184, .18);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe3f2; color: var(--ink);
    font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif; }
  canvas { display: block; }
  .glass { position: absolute; background: var(--glass); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(2, 6, 23, .35); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-sizing: border-box; font-size: 13px; line-height: 1.5; }
  .scroll { overflow: auto; scrollbar-width: thin; scrollbar-color: rgba(148,163,184,.4) transparent; }
  #panel { top: 12px; left: 12px; width: min(330px, calc(100vw - 24px)); max-height: calc(100vh - 24px); padding: 12px 14px; }
  .head { display: flex; align-items: center; gap: 6px; }
  h1 { font-size: 15px; margin: 0; flex: 1; letter-spacing: .3px; }
  .sub { color: var(--muted); font-size: 11.5px; margin: 6px 0 4px; }
  .step { font-weight: bold; margin-top: 10px; font-size: 12px; color: var(--muted); letter-spacing: .5px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px 0; }
  button { flex: 1 1 64px; border: 1px solid var(--border); background: rgba(255,255,255,.06); color: var(--ink);
    border-radius: 9px; padding: 7px 6px; font-size: 12.5px; font-family: inherit; cursor: pointer; line-height: 1.35;
    transition: background .15s, border-color .15s; }
  button:hover { background: rgba(255,255,255,.12); }
  button.on { background: var(--accent2); border-color: var(--accent); color: #fff; }
  button.mini { flex: none; padding: 3px 9px; font-size: 12px; }
  #info { background: var(--glass2); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; }
  #info b { color: var(--accent); }
  .legend { font-size: 11px; color: var(--muted); margin-top: 8px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin: 0 3px 0 6px; vertical-align: -1px; }
  /* 右側儀表板 */
  #dash { top: 12px; right: 12px; bottom: 12px; width: min(390px, calc(100vw - 24px)); display: flex; flex-direction: column;
    transition: transform .35s ease, opacity .35s ease; }
  #dash.collapsed { transform: translateX(calc(100% + 24px)); opacity: 0; pointer-events: none; }
  #dashHead { padding: 12px 14px 0; }
  #dashHead h2 { font-size: 15px; margin: 0; flex: 1; }
  .tabs { display: flex; gap: 4px; margin-top: 10px; border-bottom: 1px solid var(--border); }
  .tabs button { flex: 1; border: none; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); padding: 8px 4px; }
  .tabs button.on { background: var(--glass2); color: #fff; box-shadow: inset 0 -2px 0 var(--accent); }
  #dashBody { flex: 1; padding: 10px 14px 14px; }
  #pill { position: absolute; right: 0; top: 50%; transform: translateY(-50%); writing-mode: vertical-rl; flex: none;
    border-radius: 10px 0 0 10px; padding: 14px 8px; background: var(--glass); color: #fff; font-weight: bold;
    border: 1px solid var(--border); border-right: none; display: none; backdrop-filter: blur(12px); letter-spacing: 2px; }
  #pill.show { display: block; }
  .hero .opt { font-size: 18px; font-weight: bold; }
  .hero .tagline { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .badge { display: inline-block; font-size: 11px; font-weight: bold; border-radius: 999px; padding: 2px 9px; margin-top: 6px; }
  .badge.good { background: rgba(52,211,153,.18); color: var(--good); border: 1px solid rgba(52,211,153,.45); }
  .badge.warn { background: rgba(251,191,36,.16); color: var(--warn); border: 1px solid rgba(251,191,36,.45); }
  .badge.bad { background: rgba(248,113,113,.16); color: var(--bad); border: 1px solid rgba(248,113,113,.45); }
  .badge.neutral { background: rgba(148,163,184,.16); color: var(--muted); border: 1px solid var(--border); }
  .note { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .sec { margin-top: 12px; background: var(--glass2); border-radius: 12px; padding: 10px 12px; }
  .sec h3 { font-size: 12.5px; margin: 0 0 6px; display: flex; align-items: center; gap: 6px; }
  .sec h3 .ico { width: 18px; height: 18px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
  .metric { display: grid; grid-template-columns: 1fr 92px 46px; gap: 4px 8px; align-items: center; padding: 4px 0; }
  .metric + .metric { border-top: 1px dashed rgba(148,163,184,.15); }
  .metric .lbl { font-size: 12px; }
  .metric .rank { grid-column: 1 / 4; font-size: 10.5px; color: var(--muted); margin-top: -2px; }
  .meter { height: 7px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 4px; transition: width .45s ease; }
  .meter.cost i { background: linear-gradient(90deg, #fbbf24, #f87171); }
  .meter.ben i { background: linear-gradient(90deg, #22d3ee, #34d399); }
  .tag { font-size: 10.5px; text-align: center; border-radius: 6px; padding: 1px 0; font-weight: bold; }
  .tag.hi-cost, .tag.neg, .tag.lo-ben { color: var(--bad); background: rgba(248,113,113,.14); }
  .tag.mid { color: var(--warn); background: rgba(251,191,36,.14); }
  .tag.lo-cost, .tag.hi-ben { color: var(--good); background: rgba(52,211,153,.14); }
  .tag.base { color: var(--muted); background: rgba(148,163,184,.14); }
  .verdict { font-size: 12.5px; }
  .chain { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
  .chain div { font-size: 11.5px; padding: 5px 8px; border-radius: 8px; background: rgba(255,255,255,.04); border-left: 3px solid var(--border); }
  .chain div.hl { border-left-color: var(--accent); background: rgba(96,165,250,.12); color: #fff; }
  .eff { display: flex; gap: 10px; align-items: center; }
  .simline { font-size: 11.5px; background: rgba(96,165,250,.10); border-radius: 8px; padding: 6px 8px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 8px; }
  th, td { padding: 5px 4px; text-align: right; border-bottom: 1px solid rgba(148,163,184,.15); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: normal; font-size: 10.5px; }
  tr.cur td { background: rgba(96,165,250,.14); font-weight: bold; color: #fff; }
  #sig { display: flex; align-items: center; gap: 8px; background: var(--glass2); border-radius: 10px; padding: 8px 10px; font-size: 12px; }
  .lamp { width: 12px; height: 12px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor; }
  #overlay { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; background: rgba(15,23,42,.78); transition: opacity .5s; text-align: center; padding: 16px; }
  #overlay.hide { opacity: 0; pointer-events: none; }
  .spinner { width: 54px; height: 54px; border: 5px solid rgba(96,165,250,.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadText { font-size: 17px; font-weight: bold; }
  #err { display: none; position: absolute; inset: 0; z-index: 30; background: #0f172a; padding: 40px; font-size: 16px; line-height: 1.9; }
  .vl { margin: 4px 0 0; padding-left: 18px; font-size: 12px; } .vl li { margin: 4px 0; } .vl a, .note a { color: var(--accent); }
  @media (max-width: 760px) { #panel { max-height: 46vh; } #dash { top: auto; height: 48vh; } }
</style>
</head>

<div id="dash" class="glass">

    <div id="tab-live" style="display:none">

      <table id="kpiTable"></table>
      <div class="note" data-i18n="kpiNote"></div>
      <div class="row"><button id="resetBtn" data-i18n="reset"></button></div>
    </div>
  </div>
</div>
<button id="pill" data-i18n="pill"></button>

<div id="overlay"><div class="spinner"></div><div id="loadText" data-i18n="loading"></div></div>

function makePlan(R) {                                        // 快速車道中心線：建國南路南下 → 轉入辛亥路 → 往東至地下道
  const p = [];

    p.on = false; return;
  }
  const a = p.P[p.seg], b = p.P[p.seg + 1];
  if (!p.dep) {
    if (p.F[p.seg]) {

      if (!(sigF.st('PED') === 'G' && sigF.left() + 4 >= need)) { p.waiting = true; p.wait += dt; p.heading = Math.atan2(b[0] - a[0], b[2] - a[2]); return; }
    }

  }

const _mb = new THREE.Matrix4(), _ml = new THREE.Matrix4(), _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _one = new THREE.Vector3(1, 1, 1), _up = new THREE.Vector3(0, 1, 0);

    _ml.makeTranslation(0, 1.68, 0); IP.head.setMatrixAt(n, _m.multiplyMatrices(_mb, _ml));

/* =====================================================================
   11. CBA 儀表板（階段二定性評等，0–5；成本越高越不利；-1＝負效益）
   ===================================================================== */
const CBA = {
  cost: [
    { k: 'cCons', v: { A: 5, B: 3, C: 3 }, rank: 'A > C ≈ B' },
    { k: 'cOM', v: { A: 5, B: 4, C: 2 }, rank: 'A > B > C' },
    { k: 'cRisk', v: { A: 5, B: 3, C: 3 }, rank: 'A > B ≈ C' }
  ],
  int: [
    { k: 'iDelay', v: { A: 5, B: 2, C: 4.5 }, rank: 'A ≥ C ≫ B', note: { B: 'noteB' } },
    { k: 'iPed', v: { A: 5, B: -1, C: 4.5 }, rank: 'A ≈ C ≫ B' },
    { k: 'iSafety', v: { A: 4.5, B: 2, C: 4.5 }, rank: 'A ≈ C > B' }

  ext: [
    { k: 'eSev', v: { A: 5, B: 1.5, C: 4 }, rank: 'A > C > B' },
    { k: 'eNoise', v: { A: 4.5, B: 5, C: 2.5 }, rank: 'B ≥ A > C' },
    { k: 'eAir', v: { A: 4, B: 4, C: 2.5 }, rank: 'B ≈ A > C' },
    { k: 'eCarbon', v: { A: 2, B: 2.5, C: 4 }, rank: 'C > B ≳ A' },
    { k: 'eLand', v: { A: 5, B: 3, C: 3.5 }, rank: 'A > C ≈ B' }
  ]
};
const BADGE_CLS = { '0': 'neutral', A: 'warn', B: 'bad', C: 'good' };
function indexOf(o) {
  if (o === '0') return { b: 0, c: 0 };
  const avg = rows => rows.reduce((s, r) => s + Math.max(0, r.v[o]), 0) / rows.length;
  return { b: avg([...CBA.int, ...CBA.ext]), c: avg(CBA.cost) };
}
function meter(v, kind) {
  if (opt === '0') return `<div class="meter ${kind}"><i style="width:0"></i></div><span class="tag base">${t('tagBase')}</span>`;
  if (v < 0) return `<div class="meter ${kind}"><i style="width:4%;background:#f87171"></i></div><span class="tag neg">${t('tagNeg')}</span>`;
  const lvl = v >= 4 ? 'H' : v >= 2.5 ? 'M' : 'L';
  const cls = lvl === 'M' ? 'mid' : kind === 'cost' ? (lvl === 'H' ? 'hi-cost' : 'lo-cost') : (lvl === 'H' ? 'hi-ben' : 'lo-ben');
  return `<div class="meter ${kind}"><i style="width:${v / 5 * 100}%"></i></div><span class="tag ${cls}">${t('tag' + lvl)}</span>`;
}
function section(icon, color, titleKey, rows, kind) {
  return `<div class="sec"><h3><span class="ico" style="background:${color}">${icon}</span>${t(titleKey)}</h3>` + rows.map(r => {
    const note = (r.note && r.note[opt]) ? `<div class="rank" style="color:#fbbf24">${t(r.note[opt])}</div>` : '';
    return `<div class="metric"><span class="lbl">${t(r.k)}</span>${meter(opt === '0' ? 0 : r.v[opt], kind)}<div class="rank">${t('rankLbl')}：${r.rank}${kind === 'cost' ? ' ' + t('rankCost') : ''}</div>${note}</div>`;
  }).join('') + '</div>';
}
function effSVG() {
  const W = 150, H = 120, P = 18, X = v => P + v / 5 * (W - P - 6), Y = v => H - P - v / 5 * (H - P - 6);
  const col = { '0': '#94a3b8', A: '#fbbf24', B: '#f87171', C: '#34d399' };
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect x="${P}" y="6" width="${W - P - 6}" height="${H - P - 6}" rx="6" fill="rgba(148,163,184,.08)" stroke="rgba(148,163,184,.25)"/>`;
  s += `<line x1="${X(0)}" y1="${Y(0)}" x2="${X(5)}" y2="${Y(5)}" stroke="rgba(148,163,184,.35)" stroke-dasharray="3 3"/>`;
  OPTS.forEach(o => { const p = indexOf(o), cur = o === opt;
    s += `<circle cx="${X(p.c)}" cy="${Y(p.b)}" r="${cur ? 7 : 5}" fill="${col[o]}" ${cur ? 'stroke="#fff" stroke-width="2"' : 'opacity=".75"'}/><text x="${X(p.c) + 9}" y="${Y(p.b) + 4}" font-size="11" fill="#e5e7eb" font-weight="${cur ? 700 : 400}">${o}</text>`; });
  s += `<text x="${W - 6}" y="${H - 4}" font-size="9" fill="#94a3b8" text-anchor="end">${t('effX')}</text><text x="10" y="${H - P}" font-size="9" fill="#94a3b8" transform="rotate(-90 10 ${H - P})">${t('effY')}</text>`;

const kmh = (S, T) => T > 1 ? (S / T * 3.6).toFixed(0) + ' km/h' : t('simNA');

  const chain = [['0B', opt === 'B'], ['BC', opt === 'C' || opt === 'B'], ['CA', opt === 'A' || opt === 'C']].map(([k, hl]) => `<div class="${hl ? 'hl' : ''}">${t('chain' + k)}</div>`).join('');

    `<div class="hero"><div class="opt">${t('row' + opt)}</div><div class="tagline">${t('tag' + opt)}</div><span class="badge ${BADGE_CLS[opt]}">${t('badge' + opt)}</span></div>` +
    `<div class="note">${t('cbaSub')}</div>` +
    section('$', 'rgba(251,191,36,.25)', 'secCost', CBA.cost, 'cost') +
    section('⏱', 'rgba(34,211,238,.22)', 'secInt', CBA.int, 'ben') +
    `<div class="simline">${sim}</div>` +
    section('🌳', 'rgba(52,211,153,.22)', 'secExt', CBA.ext, 'ben') +
    `<div class="sec"><h3><span class="ico" style="background:rgba(96,165,250,.25)">⚖</span>${t('secVerdict')}</h3><div class="verdict">${t('verdict' + opt)}</div>` +
    `<div class="eff" style="margin-top:10px">${effSVG()}<div><b style="font-size:12px">${t('effTitle')}</b><div class="note">${t('effNote')}</div></div></div>` +
    `<div class="note" style="margin-top:10px"><b>${t('chainTitle')}</b></div><div class="chain">${chain}</div></div>`;

const fmt = (v, d) => (v == null || isNaN(v)) ? '—' : v.toFixed(d);

  const head = ['thOpt', 'thTime', 'thWait', 'thN', 'thX', 'thF'].map(k => `<th>${t(k)}</th>`).join('');
  const rows = OPTS.map(o => { const s = stats[o];
    return `<tr class="${o === opt ? 'cur' : ''}"><td>${t('row' + o)}</td><td>${s.n ? fmt(s.T / s.n, 0) : '—'}</td><td>${s.n ? fmt(s.W / s.n, 0) : '—'}</td><td>${s.n}</td>` +
      `<td>${s.xT > 1 ? fmt(s.xS / s.xT * 3.6, 0) : '—'}</td><td>${s.fT > 1 ? fmt(s.fS / s.fT * 3.6, 0) : '—'}</td></tr>`; }).join('');

    `${AT_GRADE(opt) ? '' : '<br><span class="note">' + t('sigNoPed') + '</span>'}</div><span style="margin-left:auto;white-space:nowrap">${t('sigLeft').replace('{s}', Math.ceil(sigF.left()))}</span>`;

/* =====================================================================
   12. 切換方案、視角、介面
   ===================================================================== */
let ready = false;
function setOption(k) {
  opt = k; optT = 0;
  OPTS.forEach(o => { G[o].visible = o === k; });
  sigF.set(AT_GRADE(k) ? PLAN_F.long : PLAN_F.short);
  rebuildNetwork();
  peds.forEach(p => { p.on = false; });
  if (ready) for (let i = 0; i < 30; i++) spawnPed(PED_LINES[i % 3], i % 3, true);
  $('info').innerHTML = t('info' + k);
  document.querySelectorAll('[data-opt]').forEach(b => b.classList.toggle('on', b.dataset.opt === k));
  renderCBA(); renderKPI();
}
document.querySelectorAll('[data-opt]').forEach(b => { b.onclick = () => setOption(b.dataset.opt); });
let tab = 'cba';
document.querySelectorAll('[data-tab]').forEach(b => { b.onclick = () => {
  tab = b.dataset.tab; document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === b));
  ['cba', 'live', 'verify'].forEach(k => { $('tab-' + k).style.display = tab === k ? '' : 'none'; });
}; });
function setDash(open) { $('dash').classList.toggle('collapsed', !open); $('pill').classList.toggle('show', !open); setTimeout(updateViewOffset, 380); }
$('dashHide').onclick = () => setDash(false); $('pill').onclick = () => setDash(true);
function updateViewOffset() {
  const W = innerWidth, H = innerHeight;
  if (W < 760) { camera.clearViewOffset(); return; }
  const lw = $('panel').getBoundingClientRect().right, rw = $('dash').classList.contains('collapsed') ? 0 : W - $('dash').getBoundingClientRect().left;
  camera.setViewOffset(W, H, -(lw - rw) / 2, 0, W, H);
}
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.minDistance = 2; controls.maxDistance = 3000;
let camGoal = null, view = 'bird';
controls.addEventListener('start', () => { camGoal = null; });
const VIEWS = {
  bird: { pos: [-380, 560, 760], tgt: [160, 0, -40] },
  west: { pos: [-330, 110, 110], tgt: [-505, 0, -140] },
  junction: { pos: [X_FX + 85, 55, 120], tgt: [X_FX, 0, -8] },
  east: { pos: [X_KL - 230, 42, 24], tgt: [X_KL - 30, -4, 0] },
  section: { pos: [X_SEC + 70, 14, 40], tgt: [X_SEC, -3, -8] },
  eye: { pos: [X_FX + 2, 1.7, 36], tgt: [X_FX - 14, 3.5, -30] }
};
renderer.localClippingEnabled = true;
let clipOn = null;
function setClip(on) {                       // 剖面：對所有網格材質套用切割平面（文字標籤不切）
  if (clipOn === on) return; clipOn = on;
  const seen = new Set();
  scene.traverse(o => { if (!o.isMesh) return; (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => {
    if (seen.has(m)) return; seen.add(m); m.clippingPlanes = on ? [CLIP] : null; m.needsUpdate = true; }); });
}
function setView(name) {
  view = name; const v = VIEWS[name];
  camGoal = { p: new THREE.Vector3(...v.pos), t: new THREE.Vector3(...v.tgt) };
  setClip(name === 'section');
  OPTS.forEach(o => { CAPS[o].visible = name === 'section'; });
  labels.forEach(e => { e.sp.visible = e.sec ? name === 'section' : name !== 'eye' && name !== 'section'; });
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === name));
}
document.querySelectorAll('[data-view]').forEach(b => { b.onclick = () => setView(b.dataset.view); });
camera.position.set(...VIEWS.bird.pos); controls.target.set(...VIEWS.bird.tgt);
let speed = 1, paused = false, perf = false;
function setSpeed(s) { speed = s; document.querySelectorAll('[data-speed]').forEach(b => b.classList.toggle('on', +b.dataset.speed === s)); }
document.querySelectorAll('[data-speed]').forEach(b => { b.onclick = () => setSpeed(+b.dataset.speed); });
setSpeed(1);
$('pauseBtn').onclick = () => { paused = !paused; $('pauseBtn').textContent = t(paused ? 'resume' : 'pause'); };
function setPerf(on) { perf = on; sun.castShadow = !perf; renderer.setPixelRatio(perf ? 1 : Math.min(window.devicePixelRatio || 1, 2)); $('perfBtn').textContent = t(perf ? 'perfOn' : 'perfOff'); }
$('perfBtn').onclick = () => setPerf(!perf);
$('resetBtn').onclick = () => { resetStats(); renderKPI(); renderCBA(); };
window.XH.hooks.push(() => {
  labels.forEach(drawLabel); $('info').innerHTML = t('info' + opt);
  $('pauseBtn').textContent = t(paused ? 'resume' : 'pause'); $('perfBtn').textContent = t(perf ? 'perfOn' : 'perfOff');
  renderKPI(); renderCBA(); updateViewOffset();
});
$('pauseBtn').textContent = t('pause'); $('perfBtn').textContent = t('perfOff');
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); updateViewOffset(); });

/* =====================================================================
   13. 陰影、模擬主迴圈
   ===================================================================== */
scene.traverse(o => {
  if (!o.isMesh || o === IC || o === IG || o === IB || Object.values(IP).includes(o)) return;
  const mats = Array.isArray(o.material) ? o.material : [o.material];
  const flat = mats.some(m => m.isMeshBasicMaterial || m.transparent);
  o.castShadow = !flat && !o.userData.noCast; o.receiveShadow = !flat;
});
function simStep(h) {
  simT += h; optT += h; sigF.step(h); sigK.step(h); sigJ.step(h); vehStep(h);
  peds.forEach(p => { if (p.on) pedStep(p, h); });
  pedSpawnStep(h);
  if (optT > 30) {
    const s = stats[opt];
    let xs = 0, xn = 0, fs = 0, fn = 0;
    for (const c of cars) {
      if (!c.on) continue;
      if (c.r.kind === 'x') { c.r.E[0].at(c.pos, _P); if (_P.z > -1 && _P.x > X_JG + 30 && _P.x < UPW) { xs += c.v; xn++; } }
      else if (c.r.kind === 'f' && c.ei === 0) { fs += c.v; fn++; }
    }

let uiAcc = 0, cbaAcc = 0, last = performance.now();
function frame(now) {

setOption('0'); setView('bird'); updateViewOffset();
for (let i = 0; i < 150 / 0.05; i++) simStep(0.05);      // 預熱：讓路網先充滿車流

for (let i = 0; i < 30; i++) spawnPed(PED_LINES[i % 3], i % 3, true);
$('overlay').classList.add('hide');
requestAnimationFrame(frame);
window.__sim = { setOption, setView, setSpeed, setPerf, setDash, stats, sig: () => sigF.cur(), cars, peds, E,
  ff: sec => { for (let k = 0; k < sec / 0.05; k++) simStep(0.05); }, geo: { A_PW, B_W, B_E, UPW, UPE } };
</script>
